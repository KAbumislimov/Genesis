# Promtail для client2 — шлёт логи на Loki через SSH tunnel (localhost:3100 → centos)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions-client2.yaml
clients:
  - url: http://localhost:3100/loki/api/v1/push
scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: client2
          __path__: /var/log/*.log
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: client2
          __path__: /var/log/syslog
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: client2
          __path__: /var/log/auth.log
  - job_name: kern
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: client2
          __path__: /var/log/kern.log
  - job_name: apt
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: client2
          __path__: /var/log/apt/*.log
  - job_name: unattended
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: client2
          __path__: /var/log/unattended-upgrades/*.log
  # Звонки Media / campus-cron (mpv) — отдельный job, без «каши» с syslog
  - job_name: campus_media
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_media
          host: client2
          __path__: /home/client2/action.log
      - targets: [localhost]
        labels:
          job: campus_media
          host: client2
          __path__: /tmp/media-cron.log
  # Лог демона cron (есть на RHEL; на Debian может не быть — glob не матчится)
  - job_name: cron
    static_configs:
      - targets: [localhost]
        labels:
          job: cron
          host: client2
          __path__: /var/log/cron*
  # Опционально: свой файл бота (если настроите запись в /var/log/campus-bot.log)
  - job_name: campus_bot
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_bot
          host: client2
          __path__: /var/log/campus-bot*.log