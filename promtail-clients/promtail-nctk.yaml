# Promtail для nctk — шлёт логи на Loki через SSH tunnel (localhost:3101 → centos:3100)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions-nctk.yaml
clients:
  - url: http://localhost:3101/loki/api/v1/push
scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/*.log
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: nctk
          __path__: /var/log/syslog
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/auth.log
  - job_name: kern
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/kern.log
  - job_name: apt
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/apt/*.log
  - job_name: unattended
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/unattended-upgrades/*.log
  - job_name: campus_landau
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_landau
          host: nctk
          __path__: /home/nctk/action.log
      - targets: [localhost]
        labels:
          job: campus_landau
          host: nctk
          __path__: /tmp/landau-cron.log
  - job_name: cron
    static_configs:
      - targets: [localhost]
        labels:
          job: cron
          host: nctk
          __path__: /var/log/cron*
  - job_name: campus_bot
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_bot
          host: nctk
          __path__: /var/log/campus-bot*.log