# Карта: код кампуса (папка в machines/<campus>, юзер на клиенте) →
# серверный control-бот (кнопки Громче/Тише/Стоп в Telegram-группе кампуса).
# Формат: campus:systemd_service:env_file
#
# Читается scripts/recover-campus-machine.sh. Если для кампуса нет строки —
# recover-campus-machine.sh всё равно полностью восстановит ОС/плеер/музыку/
# мониторинг, просто пропустит шаг с control-ботом и предупредит об этом —
# бот на новый кампус заводится отдельно, один раз (systemd-юнит + bot_*.py +
# env-файл в /opt/tg-campus-bot/), это не часть ОС-восстановления машины.
client1:tg-campus-client1.service:/opt/tg-campus-bot/client1.env
client2:tg-campus-client2.service:/opt/tg-campus-bot/client2.env
cgtk:tg-campus-cgtk.service:/opt/tg-campus-bot/cgtk.env
