# Prometheus — метрики (node_exporter на каждой машине)
# host_ip — для подписей в Grafana; на 10.20.1.106 нужен установленный node_exporter :9100
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9091']

  # nodename + relabel → instance: иначе Prometheus подставляет instance=HOST:9100,
  # а дашборды ждут campus-server / client1 / proxmox / cgtk / ubuntu — графики пустые.
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          nodename: campus-server
          host_ip: 10.10.4.120
      - targets: ['10.20.0.41:9100']
        labels:
          nodename: client1
          host_ip: 10.20.0.41
      - targets: ['10.20.1.106:9100']
        labels:
          nodename: proxmox
          host_ip: 10.20.1.106
      - targets: ['10.50.0.41:9100']
        labels:
          nodename: cgtk
          host_ip: 10.50.0.41
      - targets: ['10.205.16.12:9100']
        labels:
          nodename: ubuntu
          host_ip: 10.205.16.12
      - targets: ['10.70.0.41:9100']
        labels:
          nodename: client2
          host_ip: 10.70.0.41
      - targets: ['10.40.0.41:9100']
        labels:
          nodename: sbtk
          host_ip: 10.40.0.41
      - targets: ['10.103.0.41:9100']
        labels:
          nodename: wctk
          host_ip: 10.103.0.41
      - targets: ['10.10.0.41:9100']
        labels:
          nodename: bstk
          host_ip: 10.10.0.41
      - targets: ['10.10.0.42:9100']
        labels:
          nodename: bptk
          host_ip: 10.10.0.42
    relabel_configs:
      - source_labels: [nodename]
        regex: (.+)
        target_label: instance
        replacement: ${1}
        action: replace
      - action: labeldrop
        regex: '^nodename$'
