# Campus Infrastructure — всё в одном
# docker compose --profile logs --profile bot --profile watchdog --profile recovery up -d
# Если сломалось: docker compose down && docker compose up -d

services:
  # === ЛОГИ (Loki + Grafana + Promtail) ===
  loki:
    image: grafana/loki:2.9.5
    container_name: loki
    restart: unless-stopped
    profiles: ["logs"]
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - campus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    profiles: ["logs"]
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
      # Для мобильного доступа (Samsung и др.): корректные ссылки и cookies
      GF_SERVER_ROOT_URL: "http://10.10.4.120:3000"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Временно false — contactpoints chatid баг в Grafana 10.x (отрицательный ID как число)
      # Включить после настройки Telegram через UI: Alerting → Contact points
      GF_ALERTING_ENABLED: "false"
      # Отключить image-renderer (падает в контейнере из-за отсутствия libs)
      GF_RENDERING_SERVER_ENABLED: "false"
      GF_PLUGINS_DISABLE: "grafana-image-renderer"
      # Для provisioning contact point (интерполяция $VAR)
      NOTIFICATION_BOT_TOKEN: ${NOTIFICATION_BOT_TOKEN:-}
      NOTIFICATION_CHAT_ID: ${NOTIFICATION_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      # Только datasources + dashboards: provisioning alerting при пустых NOTIFICATION_*
      # и GF_ALERTING_ENABLED=false часто роняет Grafana в restart loop.
      # Чтобы снова поднять алерты из файлов — добавьте строку ниже (см. GRAFANA_SETUP.md).
      - ./config/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # - ./config/grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      - loki
    networks:
      - campus

  promtail:
    image: grafana/promtail:2.9.5
    container_name: promtail
    restart: unless-stopped
    profiles: ["logs"]
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - campus

  # === МЕТРИКИ (Prometheus + node_exporter) ===
  # Prometheus в host network — чтобы достучаться до client1/client2
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: unless-stopped
    profiles: ["logs"]
    network_mode: host
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.listen-address=:9091

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    profiles: ["logs"]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - campus

  # === TELEGRAM БОТЫ ===
  # ВНИМАНИЕ: боты управляются через systemd (tg-campus-client1.service / tg-campus-client2.service)
  # и нативно на client2 (campus-telegram-bot.service). Docker-версии НЕ запускать — конфликт токенов.
  # Для запуска вручную (тест): docker compose --profile bot up tg-campus-bot
  tg-campus-bot:
    build:
      context: ./bots/client1
      dockerfile: Dockerfile
    container_name: tg-campus-bot
    restart: "no"
    profiles: ["bot"]
    environment:
      - CLIENT_HOST=${CLIENT_HOST:-10.20.0.41}
      - CLIENT_USER=${CLIENT_USER:-client1}
      - CLIENT1_HOST=10.20.0.41
      - CLIENT2_HOST=10.70.0.41
    volumes:
      - ${MUSIC_ROOT_PATH:-/home/kamran/Kamran Music}:/music:ro
      - ${MEDIA_ROOT_PATH:-/home/kamran/Media}:/media:ro
      - ${SSH_KEY_DIR:-/home/kamran/.ssh}:/root/.ssh:ro
    env_file:
      - ./bots/client1/config.env
    networks:
      - campus

  tg-campus-client2:
    build:
      context: ./bots/client1
      dockerfile: Dockerfile
    container_name: tg-campus-client2
    restart: "no"
    profiles: ["bot"]
    environment:
      - CLIENT_HOST=10.70.0.41
      - CLIENT_USER=client2
      - CLIENT1_HOST=10.20.0.41
      - CLIENT2_HOST=10.70.0.41
    volumes:
      - ${MUSIC_ROOT_PATH:-/home/kamran/Kamran Music}:/music:ro
      - ${MEDIA_ROOT_PATH:-/home/kamran/Media}:/media:ro
      - ${SSH_KEY_DIR:-/home/kamran/.ssh}:/root/.ssh:ro
    env_file:
      - ./bots/client2/config.env
    networks:
      - campus

  # === RECOVERY: бэкапы + восстановление server/client1/client2 ===
  campus-recovery:
    build:
      context: ./recovery
      dockerfile: Dockerfile
    container_name: campus-recovery
    restart: always
    profiles: ["recovery"]
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSH_KEY_DIR:-/home/kamran/.ssh}:/root/.ssh:ro
      - recovery_backups:/backups
      - /etc:/host/etc:rw
      - /home/kamran:/host/home/kamran:rw
      - /root:/host/root:rw
      - /var/spool/cron:/host/var/spool/cron:rw
    environment:
      - RECOVERY_CHECK_INTERVAL=${RECOVERY_CHECK_INTERVAL:-300}
      - NOTIFICATION_BOT_TOKEN=${NOTIFICATION_BOT_TOKEN:-}
      - NOTIFICATION_CHAT_ID=${NOTIFICATION_CHAT_ID:-}
      - RECOVERY_CLIENT2_PASS=${RECOVERY_CLIENT2_PASS:-}
      - RECOVERY_CLIENT1_PASS=${RECOVERY_CLIENT1_PASS:-}
      - SYNC_BACKUPS_TO_CLIENT1=${SYNC_BACKUPS_TO_CLIENT1:-1}

  # === CAMPUS WEB UI: управление воспроизведением + расписание ===
  campus-webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    container_name: campus-webui
    restart: unless-stopped
    profiles: ["webui"]
    ports:
      - "8090:8080"
    volumes:
      - ./data/webui:/data
      - ${SSH_KEY_DIR:-/home/kamran/.ssh}:/secrets:ro
      - ${MUSIC_ROOT_PATH:-/home/kamran/Kamran Music}:/music:rw
      - ./bots/client1/config.env:/bot_config.env:ro
      - ${CAMPUS_BACKUP_DIR:-/home/kamran/campus-backups}:/campus-backups:ro
      - ./config/prometheus.yml:/prometheus-config/prometheus.yml:rw
    environment:
      - TZ=Asia/Baku
      - CLIENT1_HOST=${CLIENT1_HOST:-10.20.0.41}
      - CLIENT1_USER=${CLIENT1_USER:-client1}
      - CLIENT1_MAC=${CLIENT1_MAC:-}
      - SSH_KEY=/secrets/campus_bot
      - MUSIC_DIR=/music
      - SECRET_KEY=${WEBUI_SECRET_KEY}
      - DB_PATH=/data/webui.db
      - DEFAULT_VOL=${DEFAULT_VOL:-100}
      - CLIENT1_INBOX=/var/lib/campus-player/inbox
      # Дополнительные машины:
      - MACHINE2_HOST=10.70.0.41
      - MACHINE2_NAME=client2 Campus
      - MACHINE2_USER=client2
      - MACHINE2_MAC=98:ee:cb:28:c1:9f
      # Сервер CentOS (терминал)
      - CENTOS_HOST=${CENTOS_HOST:-10.10.4.120}
      - CENTOS_USER=${CENTOS_USER:-kamran}
      - CENTOS_SSH_KEY=${CENTOS_SSH_KEY:-/secrets/campus_bot}
      - WEBUI_STREAM_BASE=${WEBUI_STREAM_BASE:-http://10.10.4.120:8090}
      # Telegram уведомления (берём токен из bot config.env)
      - TG_LOG_GROUPS=${TG_LOG_GROUPS:-}
      # Бэкапы
      - BACKUP_DIR=/campus-backups
      - BACKUP_VAULT_PASS=${BACKUP_VAULT_PASS:-}
      - BACKUP_ADMIN_EMAILS=${BACKUP_ADMIN_EMAILS:-}
      # Email уведомления
      - NOTIFY_SMTP_HOST=${NOTIFY_SMTP_HOST:-smtp.gmail.com}
      - NOTIFY_SMTP_PORT=${NOTIFY_SMTP_PORT:-587}
      - NOTIFY_SMTP_USER=${NOTIFY_SMTP_USER:-}
      - NOTIFY_SMTP_PASS=${NOTIFY_SMTP_PASS:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      # Голосовой помощник (один из ключей достаточно)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Helpdesk Ops single sign-on bridge
      - SSO_BRIDGE_SECRET=${SSO_BRIDGE_SECRET}
      - HELPDESK_URL=${HELPDESK_URL:-https://10.10.4.120:8094}
      # Auto-registers new /machines entries as Prometheus scrape targets
      - PROMETHEUS_CONFIG=/prometheus-config/prometheus.yml
      - PROMETHEUS_RELOAD_URL=${PROMETHEUS_RELOAD_URL:-http://host.docker.internal:9091/-/reload}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - campus

  # === WATCHDOG: автовосстановление контейнеров ===
  campus-watchdog:
    build:
      context: ./watchdog
      dockerfile: Dockerfile
    container_name: campus-watchdog
    restart: always
    profiles: ["bot", "watchdog"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSH_KEY_DIR:-/home/kamran/.ssh}:/root/.ssh:ro
    environment:
      - CHECK_INTERVAL=${WATCHDOG_INTERVAL:-300}
      - SERVER_CONTAINERS=${SERVER_CONTAINERS:-loki grafana prometheus promtail node-exporter campus-watchdog campus-recovery}
      - NOTIFICATION_BOT_TOKEN=${NOTIFICATION_BOT_TOKEN:-}
      - NOTIFICATION_CHAT_ID=${NOTIFICATION_CHAT_ID:-}
    networks:
      - campus

  # === MEDIA HELPDESK: публичная форма заявок на ремонт ===
  media-helpdesk:
    build:
      context: ./helpdesk
      dockerfile: Dockerfile
    container_name: media-helpdesk
    restart: unless-stopped
    profiles: ["helpdesk"]
    ports:
      - "8091:8080"
    volumes:
      - ./data/helpdesk:/data
    environment:
      - SECRET_KEY=${HELPDESK_SECRET_KEY}
      - ADMIN_USER=${HELPDESK_ADMIN_USER}
      - ADMIN_PASS=${HELPDESK_ADMIN_PASS}
      - DB_PATH=/data/helpdesk.db
      - UPLOAD_DIR=/data/uploads
      - TG_TOKEN=${NOTIFICATION_BOT_TOKEN:-}
      - TG_CHAT=${HELPDESK_TG_CHAT:-}
      - SMTP_HOST=${NOTIFY_SMTP_HOST:-}
      - SMTP_PORT=${NOTIFY_SMTP_PORT:-587}
      - SMTP_USER=${NOTIFY_SMTP_USER:-}
      - SMTP_PASS=${NOTIFY_SMTP_PASS:-}
      - NOTIFY_TO=${HELPDESK_NOTIFY_EMAIL:-}
    networks:
      - campus

  # === COCKPIT PROXY: доступ к client2 Cockpit через CentOS ===
  cockpit-proxy:
    image: nginx:alpine
    container_name: cockpit-proxy
    restart: unless-stopped
    profiles: ["cockpit"]
    network_mode: host
    volumes:
      - ./config/cockpit-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  loki_data:
  grafana_data:
  prometheus_data:
  recovery_backups:

networks:
  campus:
    driver: bridge
