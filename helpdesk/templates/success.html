{% extends "base.html" %}
{% block title %}Hesabat qəbul edildi — LANDAU IT Report{% endblock %}
{% block content %}
<div class="container" style="text-align:center;padding-top:60px">
  <div style="font-size:72px;margin-bottom:20px">✅</div>
  <h1 style="font-size:28px;font-weight:800;color:#fff;margin-bottom:12px">Hesabat #{{ rid }} göndərildi!</h1>
  <p style="color:var(--muted);font-size:16px;max-width:480px;margin:0 auto 32px">
    Rəhbərlik və IT komandası xəbərdar edildi. Ən qısa zamanda sizinlə əlaqə saxlanılacaq.
  </p>
  <a href="/" class="btn btn-primary" style="font-size:15px;padding:12px 28px">
    <i class="bi bi-plus-circle"></i> Yeni hesabat yarat
  </a>
</div>
{% endblock %}
