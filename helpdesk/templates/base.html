<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MEDIA Helpdesk{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{
  --bg:#0b0f14;--bg2:#131920;--bg3:#1a2230;
  --border:#1e2d40;--accent:#1e90ff;--accent2:#0a6edb;
  --green:#2ea043;--red:#da3633;--yellow:#d29922;
  --text:#e6edf3;--muted:#7d8590;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}

/* HEADER */
.site-header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  height:64px;position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:12px;}
.logo-mark{
  width:42px;height:42px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;color:#fff;letter-spacing:-1px;flex-shrink:0;
}
.logo-text{line-height:1.1;}
.logo-text .brand{font-size:20px;font-weight:800;letter-spacing:2px;color:#fff;}
.logo-text .sub{font-size:11px;color:var(--muted);letter-spacing:1px;}
.header-nav{display:flex;gap:8px;align-items:center;}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;
  border:none;transition:.15s;text-decoration:none!important;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--muted);}
.btn-sm{padding:5px 12px;font-size:13px;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#b02a27;color:#fff;}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#238636;color:#fff;}

/* MAIN */
.container{max-width:900px;margin:0 auto;padding:32px 20px;}
.container-wide{max-width:1200px;margin:0 auto;padding:24px 20px;}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.card-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#fff;}

/* FORM */
.form-group{margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase;}
input,select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;color:var(--text);padding:10px 14px;font-size:15px;
  outline:none;transition:.15s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,144,255,.15);}
select option{background:var(--bg3);}
textarea{resize:vertical;min-height:100px;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
td{padding:10px 12px;border-bottom:1px solid rgba(30,48,70,.5);}
tr:hover td{background:rgba(30,144,255,.04);}

/* BADGE */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-open{background:rgba(218,54,51,.15);color:#f85149;}
.badge-in_progress{background:rgba(210,153,34,.15);color:#e3b341;}
.badge-resolved{background:rgba(46,160,67,.15);color:#3fb950;}
.badge-closed{background:rgba(125,133,144,.15);color:var(--muted);}

/* FOOTER */
.site-footer{
  margin-top:60px;padding:24px;text-align:center;
  border-top:1px solid var(--border);color:var(--muted);font-size:13px;
}
.site-footer a{color:var(--muted);}
.site-footer a:hover{color:var(--text);}
.footer-contact{margin-top:6px;font-size:12px;}

/* ALERT */
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;}
.alert-err{background:rgba(218,54,51,.15);border:1px solid rgba(218,54,51,.3);color:#f85149;}
.alert-ok{background:rgba(46,160,67,.15);border:1px solid rgba(46,160,67,.3);color:#3fb950;}

/* UPLOAD ZONE */
.upload-zone{
  border:2px dashed var(--border);border-radius:8px;padding:24px;
  text-align:center;cursor:pointer;transition:.15s;color:var(--muted);
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);color:var(--text);}
.upload-zone i{font-size:32px;display:block;margin-bottom:8px;}
.file-list{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
.file-chip{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:6px;
}
.file-chip .rm{cursor:pointer;color:var(--red);}

@media(max-width:600px){
  .site-header{padding:0 12px;}
  .logo-text .brand{font-size:16px;}
  .container,.container-wide{padding:16px 12px;}
}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a href="/" class="logo" style="text-decoration:none">
    <div class="logo-mark">L</div>
    <div class="logo-text">
      <div class="brand">MEDIA</div>
      <div class="sub">IT REPORT SİSTEMİ</div>
    </div>
  </a>
  <nav class="header-nav">
    {% block header_nav %}
    <a href="/admin/login" class="btn btn-ghost btn-sm"><i class="bi bi-shield-lock"></i> Admin</a>
    {% endblock %}
  </nav>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="site-footer">
  <div>© 2026 MEDIA Education — IT Report Sistemi</div>
  <div class="footer-contact">
    Hazırladı: <strong>Kamran</strong> &nbsp;|&nbsp;
    <a href="mailto:kamran19910101@gmail.com">kamran19910101@gmail.com</a>
  </div>
</footer>
</body>
</html>
