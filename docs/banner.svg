<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#1a2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#2a3448">
    <circle cx="60" cy="60" r="2"/><circle cx="110" cy="60" r="2"/><circle cx="160" cy="60" r="2"/>
    <circle cx="60" cy="110" r="2"/><circle cx="110" cy="110" r="2"/><circle cx="160" cy="110" r="2"/>
    <circle cx="1120" cy="280" r="2"/><circle cx="1170" cy="280" r="2"/><circle cx="1220" cy="280" r="2"/>
    <circle cx="1120" cy="300" r="2"/><circle cx="1170" cy="300" r="2"/><circle cx="1220" cy="300" r="2"/>
  </g>

  <!-- simple waveform / FFT bars motif -->
  <g transform="translate(860,120)" fill="url(#accent)" opacity="0.85">
    <rect x="0"   y="70" width="14" height="30" rx="3"/>
    <rect x="24"  y="50" width="14" height="50" rx="3"/>
    <rect x="48"  y="20" width="14" height="80" rx="3"/>
    <rect x="72"  y="40" width="14" height="60" rx="3"/>
    <rect x="96"  y="0"  width="14" height="100" rx="3"/>
    <rect x="120" y="35" width="14" height="65" rx="3"/>
    <rect x="144" y="55" width="14" height="45" rx="3"/>
    <rect x="168" y="15" width="14" height="85" rx="3"/>
    <rect x="192" y="45" width="14" height="55" rx="3"/>
    <rect x="216" y="65" width="14" height="35" rx="3"/>
    <rect x="240" y="25" width="14" height="75" rx="3"/>
    <rect x="264" y="58" width="14" height="42" rx="3"/>
  </g>

  <!-- node graph motif (monitoring / multi-campus) -->
  <g transform="translate(900,230)" stroke="#3a4560" stroke-width="2" fill="none" opacity="0.9">
    <line x1="0" y1="0" x2="80" y2="-30"/>
    <line x1="0" y1="0" x2="80" y2="30"/>
    <line x1="0" y1="0" x2="150" y2="0"/>
  </g>
  <g transform="translate(900,230)">
    <circle cx="0" cy="0" r="8" fill="#60a5fa"/>
    <circle cx="80" cy="-30" r="6" fill="#5eead4"/>
    <circle cx="80" cy="30" r="6" fill="#5eead4"/>
    <circle cx="150" cy="0" r="6" fill="#5eead4"/>
  </g>

  <!-- Title -->
  <text x="80" y="160" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="86" font-weight="700" fill="#f5f7fa">Genesis</text>
  <rect x="82" y="182" width="230" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="230" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="26" fill="#9aa7bd">
    Campus audio &amp; infrastructure platform
  </text>
  <text x="80" y="266" font-family="Verdana, Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7690">
    Monitoring · Audio broadcast · Telegram bots · Voice AI · Auto-recovery
  </text>
</svg>
