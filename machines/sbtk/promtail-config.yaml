# Promtail для sbtk — шлёт логи на сервер CentOS
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions-sbtk.yaml
clients:
  - url: http://10.10.4.120:3100/loki/api/v1/push
scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: sbtk
          __path__: /var/log/*.log
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: sbtk
          __path__: /var/log/syslog
