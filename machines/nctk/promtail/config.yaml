server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions-nctk.yaml
clients:
  - url: http://10.10.4.120:3100/loki/api/v1/push
scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: nctk
          __path__: /var/log/*.log
  - job_name: syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: nctk
          __path__: /var/log/syslog
  - job_name: campus_landau
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_landau
          host: nctk
          __path__: /home/nctk/action.log
  - job_name: campus_player
    static_configs:
      - targets: [localhost]
        labels:
          job: campus_player
          host: nctk
          __path__: /home/nctk/logs/campus-player.log
