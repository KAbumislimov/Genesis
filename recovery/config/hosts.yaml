# Машины кампуса — для мониторинга и восстановления
# Пароли — из .env (RECOVERY_*), не хранить здесь

hosts:
  server:
    name: campus-server
    host: 10.10.4.120
    user: kamran
    role: master   # управляет всеми
    backup_paths:
      - /etc
      - /home/kamran
      - /root
      - /var/spool/cron
    services:
      - docker
    critical_dirs:
      - /home/kamran/campus-infra

  client1:
    name: client1
    host: 10.20.0.41
    user: client1
    role: client
    backup_paths:
      - /etc
      - /home/client1
      - /root
      - /var/spool/cron
    services:
      - node_exporter
      - promtail
      - cron

  client2:
    name: client2
    host: 10.70.0.41
    user: client2
    role: client
    backup_paths:
      - /etc
      - /home/client2
      - /root
      - /var/spool/cron
    services:
      - node_exporter
      - promtail
      - cron
